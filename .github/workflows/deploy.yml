name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Instalador do app desktop (atualização automática). A versão é 1.0.N, onde N = número de commits
  # que mexeram em electron.cjs/preload.cjs: só muda (e só gera atualização) quando esses arquivos mudam.
  # Se essa versão (ou uma maior) já está publicada, nada é reconstruído.
  # O instalador fica numa Release do GitHub (tag desktop-latest, arquivos substituídos a cada versão):
  # o Hosting Spark proíbe .exe. O firebase.json redireciona /desktop/* para lá.
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decidir versão do desktop
        id: versao
        run: |
          N=$(git rev-list --count HEAD -- app/electron.cjs app/preload.cjs)
          VERSAO="1.0.$N"
          PUBLICADA=$(curl -fsSL https://rpg-referencias.web.app/desktop/latest.yml | grep -E '^version:' | awk '{print $2}' | tr -d "\r'\"" || true)
          echo "versão atual: $VERSAO / publicada: $PUBLICADA"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          # Não reconstrói se a versão publicada é igual ou MAIOR (evita rebaixar quem já atualizou).
          MAIOR=$(printf '%s\n%s\n' "$PUBLICADA" "$VERSAO" | sort -V | tail -1)
          if [ -n "$PUBLICADA" ] && [ "$MAIOR" = "$PUBLICADA" ]; then echo "construir=false" >> "$GITHUB_OUTPUT"; else echo "construir=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.versao.outputs.construir == 'true'
        with:
          node-version: 20

      - name: Instalar dependências
        if: steps.versao.outputs.construir == 'true'
        run: npm install
        working-directory: app

      - name: Gerar instalador
        if: steps.versao.outputs.construir == 'true'
        run: npx electron-builder --win --publish never -c.extraMetadata.version=${{ steps.versao.outputs.versao }}
        working-directory: app

      # O latest.yml sobe por último: nenhum cliente vê a versão nova antes de o instalador existir.
      - name: Publicar instalador na Release
        if: steps.versao.outputs.construir == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest > /dev/null 2>&1 || gh release create desktop-latest --title "Instalador desktop" --notes "Instalador do app desktop (atualização automática). Não apagar." --latest=false
          gh release upload desktop-latest app/release/Instalador_RPG_Anime_System.exe app/release/Instalador_RPG_Anime_System.exe.blockmap --clobber
          gh release upload desktop-latest app/release/latest.yml --clobber

  deploy:
    needs: desktop
    # O site sobe mesmo se o instalador falhar.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app
        env:
          VITE_PLASMIC_PROJECT_ID: ${{ secrets.VITE_PLASMIC_PROJECT_ID }}
          VITE_PLASMIC_PUBLIC_TOKEN: ${{ secrets.VITE_PLASMIC_PUBLIC_TOKEN }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}

      - name: Install functions dependencies
        run: npm install
        working-directory: functions

      - name: Install functions dependencies
        run: npm install
        working-directory: functions

      - name: Deploy to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools deploy --only hosting --project rpg-referencias
          EXIT_CODE=$?
          rm -f "$RUNNER_TEMP/sa.json"
          exit $EXIT_CODE